name: TaskPort CI
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ./bootstrap.sh
      - run: python -m unittest discover -s tests -v
      - run: python -m taskport.cli --repeats 3 --out experiments/ci
